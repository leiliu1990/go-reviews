/* 弈客 colorList (chunk18 原样) + 本页自定的损失分档 (他们的 level 由服务端给) */
const LEVEL_COLORS = ["", "rgba(36, 142, 53,1)", "rgba(36, 142, 53,1)", "rgba(36, 142, 53,1)",
  "#82AA28", "#DCB41E", "#EB8C00", "#DC5A14", "rgb(220,0,0)", "rgb(145,0,0)"];
const LEVEL_T = [.01, .03, .05, .08, .12, .17, .23, .32];
function levelOf(loss) {
  for (let i = 0; i < LEVEL_T.length; i++) if (loss < LEVEL_T[i]) return i + 1;
  return 9;
}
function levelColor(loss) { return LEVEL_COLORS[levelOf(loss)]; }
/* 绿色档: colorList 的 1-3 级共用同一个绿 —— 推荐点必须落在这档内, 不能"虽更优但仍差" */
const GREEN_LV = 3;
function isGreen(loss) { return levelOf(loss) <= GREEN_LV; }

function sev(l) { return l >= BAD ? "bad" : l >= WARN ? "warn" : "good"; }
function sevOf(n) { return n > 0 && D.quality[n-1] ? sev(D.quality[n-1].lostWinrate) : null; }
const wr = i => D.analysis[i] ? D.analysis[i].winrate : .5;
function fmtScore(sc) {
  if (sc === null || sc === undefined) return "—";
  return (sc >= 0 ? "黑+" : "白+") + Math.abs(sc).toFixed(1);
}

/* ── 坐标 ── */
function gtp2cr(g) {
  if (!g || g === "pass") return null;
  const c = GTP.indexOf(g[0]), n = parseInt(g.slice(1), 10);
  if (c < 0 || !n) return null;
  return { c: c, r: BS - n };
}

/* ── 局面重演 (含提子) ── */
const DIRS = [[1,0],[-1,0],[0,1],[0,-1]];
function group(g, c0, r0, who, visited) {
  const stack = [[c0, r0]], cells = [];
  let lib = false;
  while (stack.length) {
    const [c, r] = stack.pop(), i = r * BS + c;
    if (visited[i]) continue;
    visited[i] = 1; cells.push(i);
    for (const [dc, dr] of DIRS) {
      const c2 = c + dc, r2 = r + dr;
      if (c2 < 0 || r2 < 0 || c2 >= BS || r2 >= BS) continue;
      const j = r2 * BS + c2;
      if (g[j] === 0) lib = true;
      else if (g[j] === who && !visited[j]) stack.push([c2, r2]);
    }
  }
  return { cells: cells, lib: lib };
}
function boardAt(n, extra) {
  const g = new Uint8Array(BS * BS), caps = { B: 0, W: 0 };
  const labels = new Map();               // 试下手的编号
  for (const s of D.meta.initialStones) {
    const p = gtp2cr(s[1]);
    if (p) g[p.r * BS + p.c] = s[0] === "B" ? 1 : 2;
  }
  const seq = extra && extra.length ? D.moves.slice(0, n).concat(extra) : D.moves.slice(0, n);
  let lastIdx = -1;
  for (let i = 0; i < seq.length; i++) {
    const mv = seq[i], p = gtp2cr(mv.gtp);
    if (!p) continue;
    if (i >= n) labels.set(p.r * BS + p.c, i - n + 1);
    const me = mv.color === "B" ? 1 : 2, opp = me === 1 ? 2 : 1;
    g[p.r * BS + p.c] = me; lastIdx = p.r * BS + p.c;
    for (const [dc, dr] of DIRS) {
      const c2 = p.c + dc, r2 = p.r + dr;
      if (c2 < 0 || r2 < 0 || c2 >= BS || r2 >= BS) continue;
      if (g[r2 * BS + c2] !== opp) continue;
      const grp = group(g, c2, r2, opp, new Uint8Array(BS * BS));
      if (!grp.lib) { grp.cells.forEach(j => g[j] = 0); caps[mv.color] += grp.cells.length; }
    }
    const own = group(g, p.c, p.r, me, new Uint8Array(BS * BS));
    if (!own.lib) own.cells.forEach(j => { g[j] = 0; labels.delete(j); });
  }
  return { g: g, caps: caps, lastIdx: lastIdx, labels: labels };
}

/* 实战手相对最佳的损失 —— 候选的取舍基准.
   实战手若在候选里, 用同一次搜索的值 (最可比); 否则退回跨搜索的 lostWinrate. */
function realLoss() {
  if (cur >= NM) return null;                          // 末局面没有实战手可比
  const an = D.analysis[cur], tops = (an && an.topMoves) ? an.topMoves : [];
  if (!tops.length) return null;
  const isB = nextColor() === "B";
  const own = w => isB ? w : 1 - w;
  const hit = tops.find(t => t.move === D.moves[cur].gtp);
  return hit ? Math.max(0, own(tops[0].winrate) - own(hit.winrate))
             : D.quality[cur].lostWinrate;
}

/* ── 当前局面的推荐标记 (绘制与命中测试共用同一份) ── */
function suggestions() {
  if (sugCache.n === cur) return sugCache;
  const an = D.analysis[cur], tops = (an && an.topMoves) ? an.topMoves.slice(0, 4) : [];
  const base = boardAt(cur), isB = nextColor() === "B";
  const best = tops.length ? (isB ? tops[0].winrate : 1 - tops[0].winrate) : 0;
  const rl = realLoss();
  const all = [];
  tops.forEach((t, i) => {
    const own = isB ? t.winrate : 1 - t.winrate;
    const loss = Math.max(0, best - own);
    const p = gtp2cr(t.move);
    // 入选条件: 严格优于实战手 (末局面无实战手则免此条) 且本身是绿色档 (不能太差)
    const better = (rl === null || loss < rl) && isGreen(loss);
    all.push({ i: i, move: t.move, own: own, loss: loss, isB: isB, better: better,
               c: p ? p.c : -1, r: p ? p.r : -1,
               onBoard: !!p && !base.g[p.r * BS + p.c] && better });
  });
  // 实战手也画上 (弈客的 "实战" 概念): 它不在 better 集里, 单独一条
  let real = null;
  if (rl !== null) {
    const mv = D.moves[cur], p = gtp2cr(mv.gtp);
    if (p && !base.g[p.r * BS + p.c]) {
      const hit = tops.find(t => t.move === mv.gtp);
      const post = D.analysis[cur + 1];
      // 该手的胜率: 在候选里用同一次搜索的值, 否则用落子后的根胜率
      const own = hit ? (isB ? hit.winrate : 1 - hit.winrate)
                      : (post ? (isB ? post.winrate : 1 - post.winrate) : null);
      real = { i: -1, real: true, move: mv.gtp, c: p.c, r: p.r,
               own: own, loss: rl, isB: isB, onBoard: true };
    }
  }
  sugCache = { n: cur, all: all, board: all.filter(x => x.onBoard),
               real: real, realLoss: rl };
  return sugCache;
}

/* ── 棋盘 ── */
const cv = document.getElementById("board");
let geom = { st: 0, mg: 0, px: 0 };
function sizeBoard() {
  const dpr = window.devicePixelRatio || 1, css = cv.clientWidth || 440;
  cv.width = Math.round(css * dpr); cv.height = cv.width;
  const mg = Math.round(cv.width * 0.042);
  geom = { st: (cv.width - 2 * mg) / (BS - 1), mg: mg, px: cv.width };
}
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function drawStone(ctx, x, y, r, black) {
  const gr = ctx.createRadialGradient(x - r * .35, y - r * .4, r * .1, x, y, r * 1.05);
  if (black) { gr.addColorStop(0, cssVar("--stone-b-hi")); gr.addColorStop(.5, cssVar("--stone-b")); gr.addColorStop(1, cssVar("--stone-b")); }
  else { gr.addColorStop(0, "#FFFDF6"); gr.addColorStop(.62, cssVar("--stone-w")); gr.addColorStop(1, cssVar("--stone-w-lo")); }
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = gr; ctx.fill();
  if (!black) { ctx.strokeStyle = "rgba(90,80,50,.28)"; ctx.lineWidth = Math.max(1, r * .05); ctx.stroke(); }
}
function renderBoard() {
  const ctx = cv.getContext("2d"), { st, mg, px } = geom, r = st * .468;
  const S = boardAt(cur, shown() ? shown().moves : null);
  ctx.fillStyle = cssVar("--board"); ctx.fillRect(0, 0, px, px);
  ctx.strokeStyle = cssVar("--board-line"); ctx.lineWidth = Math.max(1, px / 760);
  ctx.beginPath();
  for (let i = 0; i < BS; i++) {
    const p = mg + i * st;
    ctx.moveTo(Math.round(p) + .5, mg); ctx.lineTo(Math.round(p) + .5, mg + (BS - 1) * st);
    ctx.moveTo(mg, Math.round(p) + .5); ctx.lineTo(mg + (BS - 1) * st, Math.round(p) + .5);
  }
  ctx.stroke();
  if (BS === 19) {
    ctx.fillStyle = cssVar("--board-line");
    H19.forEach(([c, rr]) => { ctx.beginPath(); ctx.arc(mg + c * st, mg + rr * st, Math.max(1.6, st * .1), 0, Math.PI * 2); ctx.fill(); });
  }
  ctx.fillStyle = cssVar("--board-label"); ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = Math.max(7, Math.round(st * .33)) + "px " + cssVar("--mono");
  for (let i = 0; i < BS; i++) {
    ctx.fillText(GTP[i], mg + i * st, mg - st * .64);
    ctx.fillText(String(BS - i), mg - st * .68, mg + i * st);
  }
  for (let i = 0; i < S.g.length; i++) {
    if (!S.g[i]) continue;
    const c = i % BS, rr = (i - c) / BS;
    drawStone(ctx, mg + c * st, mg + rr * st, r, S.g[i] === 1);
  }
  // 试下手的编号 (弈客: markerStyle "LB", markerNum 1 起)
  if (S.labels.size) {
    ctx.textBaseline = "middle"; ctx.textAlign = "center";
    S.labels.forEach((num, idx) => {
      const c = idx % BS, rr = (idx - c) / BS;
      const txt = String(num);
      ctx.font = Math.round(txt.length > 1 ? r * 1.2 : r * 1.5) + "px " + cssVar("--mono");
      // 弈客 markupBlackColor / markupWhiteColor
      ctx.fillStyle = S.g[idx] === 1 ? "rgba(255,255,255,0.9)" : "rgba(0,0,0,0.7)";
      ctx.fillText(txt, mg + c * st, mg + rr * st);
    });
  }

  // 末手: 红色向下三角 (弈客 lastMoveColor "red", 几何照搬)
  if (S.lastIdx >= 0 && !S.labels.size) {
    const c = S.lastIdx % BS, rr = (S.lastIdx - c) / BS;
    const x = mg + c * st, y = mg + rr * st;
    ctx.fillStyle = "#FF0000";
    ctx.beginPath();
    ctx.moveTo(x - .5, y + .5 + Math.round(r / 1.2));
    ctx.lineTo(Math.round(x - r / 1.5) - .5, Math.round(y + r / 2) + .5);
    ctx.lineTo(Math.round(x + r / 1.5) + .5, Math.round(y + r / 2) + .5);
    ctx.closePath(); ctx.fill();
  }

  // 推荐着点: 弈客 YKLBBW —— 色圆 + 胜率数字, 首选带 "1" 角标
  if (!shown()) {
    const lw = Math.max(1, r / 8);
    // 弈客 YKLBBW: 色圆 + 胜率数字.
    // 实战手不用文字角标 —— 标记圆本就快填满格子, 外挂字会出格;
    // 改成圆盘内缩 + 常规半径上描一道外圈, 总占位与其他标记一致.
    const R0 = Math.max(0, r - lw) + 2;             // 常规标记半径 (≈填满格子)
    // 实战手的外圈: 外沿必须留在格内, 所以按格半距反算, 再把圆盘缩到圈内
    const ringW = Math.max(1.5, lw * 0.8);
    const Rring = Math.min(R0, st / 2 - ringW / 2 - 0.4);
    const Rreal = Math.max(3, Rring - ringW / 2 - Math.max(1, lw * 0.3));
    const kReal = Rreal / R0;                       // 圆盘缩放比
    const mono = cssVar("--mono");
    // 弈客的字号档 (1字 1.5r / 2字 1.2r / 更长 0.75r), scale 用于内缩的圆盘
    const tier = (t, scale) => Math.round(
      (t.length > 2 ? 3 * r / 4 : t.length === 2 ? 1.2 * r : 1.5 * r) * scale);
    // 内缩圆盘里放胜率: 守同一字号档, 实测装不下才退成整数
    const label = (own, R, scale) => {
      if (own === null) { ctx.font = Math.round(R) + "px " + mono; return "?"; }
      const pct = own * 100;
      for (const t of [pct.toFixed(1), String(Math.round(pct))]) {
        ctx.font = tier(t, scale) + "px " + mono;
        if (!ctx.measureText || ctx.measureText(t).width <= 2 * R - 2) return t;
      }
      const t = String(Math.round(pct));
      ctx.font = Math.round(tier(t, scale) * .8) + "px " + mono;
      return t;
    };
    const mark = (sg, kind) => {
      const x = mg + sg.c * st, y = mg + sg.r * st;
      const isReal = kind === "real";
      const R = isReal ? Rreal : R0;
      ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2, true);
      ctx.fillStyle = levelColor(sg.loss); ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = sg.isB ? "black" : "white"; ctx.stroke();
      ctx.fillStyle = "#eeeeee"; ctx.textBaseline = "middle"; ctx.textAlign = "center";
      let txt;
      if (isReal) {
        txt = label(sg.own, R, kReal);                // 同档字号 × 缩放比, 必要时退整数
      } else {
        txt = sg.own === null ? "?" : (sg.own * 100).toFixed(1);
        ctx.font = tier(txt, 1) + "px " + mono;
      }
      ctx.fillText(txt, x, y, 2 * R);
      if (isReal) {                                   // 实战手: 盘外一道圈
        ctx.beginPath(); ctx.arc(x, y, Rring, 0, Math.PI * 2, true);
        ctx.lineWidth = ringW;
        ctx.strokeStyle = sg.isB ? "black" : "white";
        ctx.stroke();
      } else if (kind === "top") {                    // 弈客的 main 角标
        const bx = x + r / 1.4, by = y - r / 1.4, br = Math.max(0, r / 2.3);
        ctx.fillStyle = sg.isB ? "black" : "white";
        ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2, true); ctx.fill();
        ctx.fillStyle = sg.isB ? "white" : "black";
        ctx.font = Math.round(r) + "px " + cssVar("--mono");
        ctx.fillText("1", bx, by, 2 * r);
      }
    };
    const sug = suggestions();
    if (sug.real) mark(sug.real, "real");
    sug.board.forEach((sg, k) => mark(sg, k === 0 ? "top" : null));
  }
  return S;
}

/* ── 胜率条 + 选手行 ── */
function renderBar() {
  const w = wr(cur), b = w * 100, wh = 100 - b;
  const L = document.getElementById("vsl"), R = document.getElementById("vsr");
  L.style.width = b.toFixed(1) + "%"; R.style.width = wh.toFixed(1) + "%";
  L.textContent = b >= 16 ? b.toFixed(1) + "%" : "";
  R.textContent = wh >= 16 ? wh.toFixed(1) + "%" : "";
  document.getElementById("bwr").textContent = b.toFixed(1) + "%";
  document.getElementById("wwr").textContent = wh.toFixed(1) + "%";
}

/* ── 推荐着点 (弈客行式: 编号棋子 / 坐标 / 实战 / 胜率 / 领先落后) ── */
function renderRecommend() {
  const an = D.analysis[cur], host = document.getElementById("rlist");
  const played = cur < NM ? D.moves[cur].gtp : null;
  const isB = nextColor() === "B";
  document.getElementById("rctx").textContent =
    (cur === 0 ? "开局" : "第 " + cur + " 手后") + " · 轮" + (isB ? "黑" : "白") + "走";
  const sug = suggestions(), all = sug.all;
  const nBetter = sug.board.length;
  document.getElementById("rgap").textContent =
    sug.realLoss === null
      ? (nBetter ? "盘上标出 " + nBetter + " 个候选" : "无绿色档候选")
      : nBetter ? "盘上: 实 + " + nBetter + " 个更优点"
                : (isGreen(sug.realLoss) ? "盘上: 实战即最佳" : "盘上: 仅实战手 (无绿色档更优点)");
  if (!all.length) { host.innerHTML = '<div class="none">该局面没有候选数据</div>'; return; }
  const tops = an.topMoves;
  host.innerHTML = all.map((sg, i) => {
    const t = tops[i];
    const sl = isB ? t.scoreLead : -t.scoreLead;    // 该方视角: 正=领先
    const ahead = sl >= 0;
    const on = trial && trial.sel === sg.move ? " on" : "";
    const dim = sg.better ? "" : " weak";           // 不优于实战 -> 弱化, 与盘面一致
    return '<div class="rrow' + on + dim + '" data-mv="' + sg.move + '" data-i="' + i + '" role="button" tabindex="0">'
      + '<span class="chip ' + (isB ? "b" : "w") + '">' + String(i + 1).padStart(2, "0") + '</span>'
      + '<span class="co">' + sg.move + '</span>'
      + (played && sg.move === played
          ? '<span class="shizhan" style="background:' + LEVEL_COLORS[levelOf(sg.loss)] + '">实战</span>' : '')
      + '<span class="wr">' + (sg.own * 100).toFixed(1) + '%</span>'
      + '<span class="sl ' + (ahead ? "ahead" : "behind") + '">'
        + (ahead ? "领先" : "落后") + " " + Math.abs(sl).toFixed(1) + ' 目</span></div>';
  }).join("");
  host.querySelectorAll(".rrow").forEach(el => {
    const mv = el.dataset.mv, i = Number(el.dataset.i);
    el.addEventListener("click", () => toggleTrial(mv, i));
    el.addEventListener("mouseenter", () => setHover(mv, i));
    el.addEventListener("mouseleave", () => setHover(null));
    el.addEventListener("focus", () => setHover(mv, i));
    el.addEventListener("blur", () => setHover(null));
    el.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleTrial(mv, i); }
    });
  });
  markRows();
}

/* ── 盘上命中测试: 鼠标移到推荐标记上就预览后续手顺 ── */
function hitSuggestion(e) {
  const b = cv.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  const scale = cv.width / b.width;                    // CSS 像素 -> canvas 像素
  const x = (t.clientX - b.left) * scale, y = (t.clientY - b.top) * scale;
  const { st, mg } = geom, rad = st * .468 + 2;
  const sug = suggestions();
  for (const sg of sug.board.concat(sug.real ? [sug.real] : [])) {
    const dx = x - (mg + sg.c * st), dy = y - (mg + sg.r * st);
    if (dx * dx + dy * dy <= rad * rad) return sg;
  }
  return null;
}
cv.addEventListener("mousemove", e => {
  const sg = hitSuggestion(e);
  cv.style.cursor = sg ? "pointer" : "default";
  if (!trial) setHover(sg ? sg.move : null, sg ? sg.i : 0);
});
cv.addEventListener("mouseleave", () => { cv.style.cursor = "default"; setHover(null); });
cv.addEventListener("click", e => {                    // 触屏/点按也能钉住
  const sg = hitSuggestion(e);
  if (sg) { hover = null; toggleTrial(sg.move, sg.i); }
});

/* ── 试下 / 悬停预览 (弈客 recommendStoneTop / hoverActive) ── */
function buildTrial(mv, i) {
  if (i === -1) {                                      // 实战手 -> 摆真实的后续进行
    const n = Math.min(6, NM - cur);
    if (n <= 0) return null;
    return { sel: mv, real: true,
             moves: D.moves.slice(cur, cur + n).map(m => ({ color: m.color, gtp: m.gtp })) };
  }
  const an = D.analysis[cur];
  const t = an && an.topMoves ? an.topMoves[i] : null;
  if (!t) return null;
  const pv = (t.pv && t.pv.length) ? t.pv : [t.move];
  let col = nextColor();
  return { sel: mv, moves: pv.map(g => { const m = { color: col, gtp: g }; col = col === "B" ? "W" : "B"; return m; }) };
}
function syncBar() {
  const a = shown(), bar = document.getElementById("tbar");
  if (!a) { bar.hidden = true; return; }
  bar.hidden = false;
  bar.classList.toggle("preview", !trial);
  document.getElementById("tinfo").innerHTML =
    (a.real ? (trial ? "实战进行 <b>" : "实战进行 <b>") : (trial ? "试下 <b>" : "预览 <b>"))
    + a.sel + "</b> 后续 " + a.moves.length + " 手"
    + (trial ? "" : " · 移开指针还原");
  document.getElementById("texit").hidden = !trial;
}
/* 只切行的高亮, 不重建 DOM —— 否则鼠标下的节点被换掉, hover 会抖 */
function markRows() {
  const a = shown();
  document.querySelectorAll(".rrow").forEach(el => {
    el.classList.toggle("on", !!trial && trial.sel === el.dataset.mv);
    el.classList.toggle("hv", !trial && !!a && a.sel === el.dataset.mv);
  });
}
function toggleTrial(mv, i) {
  if (trial && trial.sel === mv) { trial = null; }
  else { trial = buildTrial(mv, i); hover = null; }
  renderBoard(); syncBar(); markRows();
}
function setHover(mv, i) {
  if (trial) return;                                   // 弈客: 已点选时 hover 不生效
  if ((hover && hover.sel === mv) || (!hover && !mv)) return;
  hover = mv ? buildTrial(mv, i) : null;
  renderBoard(); syncBar(); markRows();
}
function exitTrial() {
  trial = null; hover = null;
  renderBoard(); syncBar(); markRows();
}
function nextColor() {
  const hcp = D.meta.initialStones.length > 0 && D.meta.handicap > 0;
  return hcp ? (cur % 2 === 1 ? "B" : "W") : (cur % 2 === 0 ? "B" : "W");
}

/* ── 胜率曲线 ── */
const svg = document.getElementById("chart"), tip = document.getElementById("tip");
const CW = 480, CH = 200, PL = 30, PR = 8, PT = 8, PB = 18;
const plotW = CW - PL - PR, plotH = CH - PT - PB;
const xAt = i => PL + (NM ? i / NM : 0) * plotW;
const yAt = w => PT + (1 - w) * plotH;
const BL = D.quality.map((q, i) => ({ n: i + 1, lost: q.lostWinrate, color: D.moves[i].color,
    best: q.bestMove, gtp: D.moves[i].gtp, sev: sev(q.lostWinrate) })).filter(b => b.lost >= WARN);
function buildChart() {
  svg.setAttribute("viewBox", "0 0 " + CW + " " + CH);
  const ns = "http://www.w3.org/2000/svg";
  const el = (t, a) => { const e = document.createElementNS(ns, t); for (const k in a) e.setAttribute(k, a[k]); return e; };
  svg.textContent = "";
  let up = "M" + xAt(0) + "," + yAt(.5), dn = "M" + xAt(0) + "," + yAt(.5);
  for (let i = 0; i <= NM; i++) {
    const w = wr(i);
    up += "L" + xAt(i) + "," + yAt(Math.max(.5, w));
    dn += "L" + xAt(i) + "," + yAt(Math.min(.5, w));
  }
  up += "L" + xAt(NM) + "," + yAt(.5) + "Z"; dn += "L" + xAt(NM) + "," + yAt(.5) + "Z";
  svg.appendChild(el("path", { d: dn, fill: "var(--chart-w)" }));
  svg.appendChild(el("path", { d: up, fill: "var(--chart-b)", "fill-opacity": ".88" }));
  [0, .25, .75, 1].forEach(v => {
    svg.appendChild(el("line", { x1: PL, x2: PL + plotW, y1: yAt(v), y2: yAt(v), stroke: "var(--line)", "stroke-width": ".6" }));
    const t = el("text", { x: PL - 5, y: yAt(v) + 3, "text-anchor": "end" });
    t.textContent = Math.round(v * 100) + "%"; svg.appendChild(t);
  });
  svg.appendChild(el("line", { x1: PL, x2: PL + plotW, y1: yAt(.5), y2: yAt(.5), stroke: "var(--ink-3)", "stroke-width": ".9", "stroke-dasharray": "3 3" }));
  const step = NM > 180 ? 50 : NM > 80 ? 25 : 10;
  for (let n = 0; n <= NM; n += step) {
    const t = el("text", { x: xAt(n), y: CH - 5, "text-anchor": n === 0 ? "start" : "middle" });
    t.textContent = n; svg.appendChild(t);
  }
  let line = "";
  for (let i = 0; i <= NM; i++) line += (i ? "L" : "M") + xAt(i) + "," + yAt(wr(i));
  svg.appendChild(el("path", { d: line, fill: "none", stroke: "var(--ink)", "stroke-width": "1.5", "stroke-opacity": ".7", "stroke-linejoin": "round" }));
  BL.forEach(b => svg.appendChild(el("line", {
    x1: xAt(b.n), x2: xAt(b.n), y1: yAt(wr(b.n)), y2: yAt(wr(b.n - 1)),
    stroke: levelColor(b.lost),
    "stroke-width": b.lost >= BAD ? "2.4" : "1.7", "stroke-linecap": "round" })));
  const mk = el("line", { id: "cursor", y1: PT, y2: PT + plotH, stroke: "var(--accent)", "stroke-width": "1.2" });
  mk.setAttribute("x1", xAt(cur)); mk.setAttribute("x2", xAt(cur)); svg.appendChild(mk);
  const hd = el("circle", { id: "cdot", r: "3.4", fill: "var(--accent)", stroke: "var(--card)", "stroke-width": "1.5" });
  hd.setAttribute("cx", xAt(cur)); hd.setAttribute("cy", yAt(wr(cur))); svg.appendChild(hd);
}
function moveFromEvent(e) {
  const b = svg.getBoundingClientRect();
  const x = ((e.touches ? e.touches[0].clientX : e.clientX) - b.left) / b.width * CW;
  return Math.max(0, Math.min(NM, Math.round((x - PL) / plotW * NM)));
}
svg.addEventListener("mousemove", e => {
  const n = moveFromEvent(e), b = svg.getBoundingClientRect(), w = wr(n);
  tip.style.opacity = "1";
  tip.style.left = (xAt(n) / CW * b.width) + "px";
  tip.style.top = (yAt(w) / CH * b.height - 8) + "px";
  tip.textContent = (n === 0 ? "开局" : "第 " + n + " 手") + " · 黑 " + (w * 100).toFixed(1) + "% · "
    + fmtScore(D.analysis[n] ? D.analysis[n].scoreLead : 0);
});
svg.addEventListener("mouseleave", () => tip.style.opacity = "0");
svg.addEventListener("click", e => goto(moveFromEvent(e)));

/* ── 失着榜 ── */
function buildLists() {
  ["B", "W"].forEach(col => {
    const host = document.getElementById("list" + col);
    const rows = BL.filter(b => b.color === col).sort((a, b) => b.lost - a.lost).slice(0, 8);
    if (!rows.length) { host.innerHTML = '<div class="none">无损失超过 10% 的手</div>'; return; }
    const bg = col === "B" ? "radial-gradient(circle at 34% 30%, var(--stone-b-hi), var(--stone-b) 62%)"
                           : "radial-gradient(circle at 34% 30%, #fff, var(--stone-w-lo))";
    const bd = col === "B" ? "" : ";border:1px solid var(--line)";
    host.innerHTML = rows.map(b =>
      '<div class="mrow" data-n="' + b.n + '"><span class="st" style="background:' + bg + bd + '"></span>'
      + '<span class="hn">' + b.n + '</span><span class="co">' + b.gtp + '</span>'
      + '<span class="ls" style="color:' + levelColor(b.lost) + '">-' + (b.lost * 100).toFixed(0) + '%</span>'
      + '<span class="bm">推荐 ' + (b.best || "—") + '</span></div>').join("");
    host.querySelectorAll(".mrow").forEach(el => el.addEventListener("click", () => goto(Number(el.dataset.n))));
  });
}
function hiLists() {
  document.querySelectorAll(".mrow").forEach(el => el.classList.toggle("on", Number(el.dataset.n) === cur));
}

/* ── 分栏切换 ── */
document.querySelectorAll('[role="tab"]').forEach((btn, i) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll('[role="tab"]').forEach((b, j) => {
      b.setAttribute("aria-selected", String(i === j));
      document.getElementById("p" + j).hidden = i !== j;
    });
  });
});

/* ── 导航 ── */
function goto(n) {
  cur = Math.max(0, Math.min(NM, n));
  trial = null; hover = null;
  document.getElementById("tbar").hidden = true;
  const S = renderBoard();
  renderBar(); renderRecommend(); syncBar();
  const c = document.getElementById("cursor"), d = document.getElementById("cdot");
  if (c) { c.setAttribute("x1", xAt(cur)); c.setAttribute("x2", xAt(cur)); }
  if (d) { d.setAttribute("cx", xAt(cur)); d.setAttribute("cy", yAt(wr(cur))); }
  hiLists();
}
document.getElementById("texit").onclick = exitTrial;
const STEP = 5;
document.getElementById("first").onclick = () => goto(0);
document.getElementById("back5").onclick = () => goto(cur - STEP);
document.getElementById("prev").onclick = () => goto(cur - 1);
document.getElementById("next").onclick = () => goto(cur + 1);
document.getElementById("fwd5").onclick = () => goto(cur + STEP);
document.getElementById("last").onclick = () => goto(NM);
document.addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
  if (e.key === "ArrowLeft") { goto(cur - (e.shiftKey ? STEP : 1)); e.preventDefault(); }
  else if (e.key === "ArrowRight") { goto(cur + (e.shiftKey ? STEP : 1)); e.preventDefault(); }
  else if (e.key === "Home") { goto(0); e.preventDefault(); }
  else if (e.key === "End") { goto(NM); e.preventDefault(); }
});

/* ── 导出棋谱 ──
   下载走 Blob + <a download>。注意: 在 claude.ai 的 artifact 预览里
   页面自己发起的下载会被沙箱拦掉, 所以同时留了「复制棋谱」兜底;
   GitHub Pages 这种普通网页下两个都正常。 */
const msg = (t) => {
  const el = document.getElementById("actmsg");
  el.textContent = t;
  clearTimeout(msg._t);
  msg._t = setTimeout(() => { el.textContent = ""; }, 4000);
};
document.getElementById("dlsgf").onclick = () => {
  if (!D.sgf) { msg("这份页面里没有棋谱数据"); return; }
  try {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([D.sgf], { type: "application/x-go-sgf;charset=utf-8" }));
    a.download = D.file || "game.sgf";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    msg("已导出 " + (D.file || "game.sgf") + "　若没反应请改用「复制棋谱」");
  } catch (e) {
    msg("导出失败, 请改用「复制棋谱」: " + e.message);
  }
};
document.getElementById("cpsgf").onclick = async () => {
  if (!D.sgf) { msg("这份页面里没有棋谱数据"); return; }
  try {
    await navigator.clipboard.writeText(D.sgf);
    msg("棋谱已复制到剪贴板");
  } catch {
    // 剪贴板不可用时退一步: 弹一个可全选的文本框
    const ta = document.createElement("textarea");
    ta.value = D.sgf;
    ta.readOnly = true;
    ta.setAttribute("style",
      "position:fixed;left:5%;top:15%;width:90%;height:50%;z-index:99;font:12px monospace;padding:10px");
    document.body.appendChild(ta);
    ta.select();
    msg("剪贴板不可用, 已弹出文本框: 全选复制, 点别处关闭");
    ta.addEventListener("blur", () => ta.remove());
  }
};

/* ── 启动 ── */
sizeBoard(); buildChart(); buildLists(); goto(NM);
let rt;
window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { sizeBoard(); renderBoard(); }, 120); });
if (window.matchMedia) window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => renderBoard());
</script>
